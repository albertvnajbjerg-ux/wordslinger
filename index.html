<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4FC3F7">
    <title>Wordslinger</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">

        <!-- ========== GAME SCREEN ========== -->
        <div id="game-screen">
            <!-- Player zones are generated dynamically in app.js -->
            <div id="zones-container"></div>

            <!-- Center buttons -->
            <div class="center-buttons">
                <button id="btn-settings" class="circle-btn" aria-label="Settings">
                    <svg viewBox="0 0 24 24" fill="#fff" width="26" height="26">
                        <path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/>
                    </svg>
                </button>
                <button id="btn-play" class="circle-btn play-btn" aria-label="Play/Pause">
                    <svg id="icon-play" viewBox="0 0 24 24" fill="#fff" width="34" height="34">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="icon-pause" viewBox="0 0 24 24" fill="#fff" width="34" height="34" class="hidden">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
                <button id="btn-reset" class="circle-btn" aria-label="Reset">
                    <svg viewBox="0 0 24 24" fill="#fff" width="26" height="26">
                        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- ========== SETTINGS SCREEN ========== -->
        <div id="settings-screen" class="hidden">
            <div class="settings-header">
                <button id="settings-close" class="settings-side-btn" aria-label="Close">&times;</button>
                <h1>Settings</h1>
                <button id="settings-save" class="settings-side-btn" aria-label="Save">&#10003;</button>
            </div>
            <div class="settings-body">
                <h2>Choose Players</h2>
                <div class="player-count-btns">
                    <button class="count-btn" data-count="2">2</button>
                    <button class="count-btn" data-count="3">3</button>
                    <button class="count-btn" data-count="4">4</button>
                    <button class="count-btn" data-count="5">5</button>
                    <button class="count-btn" data-count="6">6</button>
                </div>
                <div id="player-settings"></div>
            </div>
        </div>

        <div id="rotate-prompt" class="hidden">
            <span class="rotate-icon">&#10227;</span>
            <span>Læg telefonen på langs for mere plads</span>
        </div>

        <div id="toast" class="hidden"></div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>
</html>
